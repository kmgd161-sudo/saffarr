        .ajax-loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    min-height: 200px;
    width: 100%;
    color: #555;
    font-size: 14px;
    text-align: center;
}

.loading-spinner {
    width: 38px;
    height: 38px;
    border: 3px solid #e5e5e5;
    border-top-color: #222;
    border-radius: 50%;
    animation: ajaxSpin 0.8s linear infinite;
}

@keyframes ajaxSpin {
    to {
        transform: rotate(360deg);
    }
}

.ajax-error {
    padding: 30px 15px;
    text-align: center;
    color: #c62828;
}

.ajax-error button {
    display: block;
    margin: 12px auto 0;
    padding: 8px 16px;
    border: 0;
    border-radius: 5px;
    cursor: pointer;
}
    </style>

<script>
$(document).on("click", "#listIcon", function () {
    const $galleryList = $("#galleryList");

    // نمایش لودینگ قبل از شروع درخواست
    $galleryList.html(`
        <div class="ajax-loading">
            <div class="loading-spinner"></div>
            <p>Loading...</p>
        </div>
    `);

    // دریافت محتوای لیست
    $galleryList.load("/load-list1.bc?catid=[##cms.query.catid##]", function (response, status) {
        if (status === "error") {
            $galleryList.html(`
                <div class="ajax-error">
                    Error in Load-Try Again.
                    <button type="button" id="retryList">Try Again</button>
                </div>
            `);
        }
    });
});

// تلاش مجدد در صورت بروز خطا
$(document).on("click", "#retryList", function () {
    $("#listIcon").trigger("click");
});
    </script>
