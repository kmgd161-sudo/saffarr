    <script>
        document.querySelectorAll('.cv-table-load').forEach(function(button) {
            var table = button.closest('.cv-table');
            button.addEventListener('click', function() {
                var expanded = table.classList.toggle('is-expanded');
                button.setAttribute('aria-expanded', String(expanded));
                button.innerHTML = (expanded ? 'Load Less' : 'Load More') + ' <span>' + (expanded ? '−' : '+') + '</span>';
            });
        });

        document.querySelectorAll('.cv-load-more').forEach(function(button) {
            var grid = button.closest('.cv-affiliations').querySelector('.cv-logo-grid');
            button.setAttribute('aria-expanded', 'false');
            button.addEventListener('click', function() {
                var expanded = grid.classList.toggle('is-expanded');
                button.setAttribute('aria-expanded', String(expanded));
                button.innerHTML = (expanded ? 'Load Less' : 'Load More') + ' <span>' + (expanded ? '−' : '+') + '</span>';
            });
        });

        (function() {
            var sheet = document.querySelector('.cv-sheet');
            var header = document.querySelector('header');
            var ticking = false;

            function syncHeader() {
                ticking = false;
                var threshold = sheet.offsetTop - (header ? header.offsetHeight : 80);
                document.body.classList.toggle('cv-header-on-sheet', window.scrollY >= threshold);
            }
            syncHeader();
            window.addEventListener('resize', syncHeader);
            window.addEventListener('scroll', function() {
                if (ticking) return;
                ticking = true;
                requestAnimationFrame(syncHeader);
            }, {
                passive: true
            });
        })();
    </script>
