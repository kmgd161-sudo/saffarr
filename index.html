    <link rel="stylesheet" href="css/style.css">
     <style>
        /* Home: on desktop the glass orb follows the mouse over the whole page and acts as the cursor */
        @media (hover: hover) and (pointer: fine) {
            .home .orb {
                animation: none !important;
                transform: translate(-50%, -50%) !important;
                backdrop-filter: blur(3.5px) brightness(1.25) saturate(1.05);
                -webkit-backdrop-filter: blur(3.5px) brightness(1.25) saturate(1.05);
                pointer-events: none;
                translate: var(--orb-x, 0px) var(--orb-y, 0px) !important;
            }
            .home .orb::before {
                animation: none !important;
            }
        }
        @media (hover: hover) and (pointer: fine) {
            body.home-page,
            body.home-page * {
                cursor: none !important;
            }
            /* keep a hand on links and buttons so they are still clearly clickable */
            body.home-page a,
            body.home-page a *,
            body.home-page button,
            body.home-page button *,
            body.home-page .theme,
            body.home-page .theme * {
                cursor: pointer !important;
            }
            /* the open menu sits above the orb, so it gets the normal cursor back */
            body.home-page .overlay,
            body.home-page .overlay * {
                cursor: auto !important;
            }
            body.home-page .overlay a,
            body.home-page .overlay a *,
            body.home-page .overlay button,
            body.home-page .overlay button *,
            body.home-page .overlay .mini-logo {
                cursor: pointer !important;
            }
            .circle-hit {
                display: none !important; /* older circle-only version, no longer used */
            }
        }
        /* orb: glass lens (refraction + rainbow rim), like the Figma design.
           On desktop the glass is drawn by .orb-lens (a fixed layer that tracks the orb),
           so the lens filter is never affected by the parents' transforms. */
        .home .orb,
        .orb-lens {
            background: radial-gradient(circle, rgba(0, 0, 0, .12) 0 55%, rgba(0, 0, 0, 0) 72%);
            border: 0;
            box-shadow: none !important; /* a shadow shifts the SVG lens in Chrome */
            backdrop-filter: blur(2px) brightness(1.15) contrast(1.1) !important;
            -webkit-backdrop-filter: blur(2px) brightness(1.15) contrast(1.1) !important;
        }
        .orb-lens {
            position: fixed;
            left: 0;
            top: 0;
            z-index: 6; /* above the header, below the open menu (20) */
            border-radius: 50%;
            overflow: hidden;
            pointer-events: none;
            backdrop-filter: url(#orbLens) brightness(1.15) contrast(1.1) !important;
        }
        html.has-lens .home .orb {
            visibility: hidden;
        }
        /* iridescent rim */
        .home .orb::before,
        .orb-lens::before {
            content: "";
            position: absolute;
            display: block !important;
            inset: 0 !important;
            border-radius: 50%;
            background: conic-gradient(from 200deg, #ff5a36, #ffb347 12%, #fff3c4 18%, #6fd3ff 32%,
                #3a6bff 45%, #9b5cff 58%, #ff4f8b 70%, #ffb347 82%, #6fd3ff 92%, #ff5a36) !important;
            -webkit-mask: radial-gradient(circle, transparent 58%, #000 76%, #000 100%);
            mask: radial-gradient(circle, transparent 58%, #000 76%, #000 100%);
            filter: blur(1.5px) saturate(1.3) !important;
            mix-blend-mode: screen !important;
            opacity: .85 !important;
            animation: none !important;
            pointer-events: none;
        }
        /* reflections inside the glass */
        .home .orb::after,
        .orb-lens::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background:
                radial-gradient(ellipse 34% 14% at 42% 20%, rgba(255, 255, 255, .9), rgba(255, 255, 255, 0) 100%),
                radial-gradient(ellipse 22% 9% at 60% 32%, rgba(140, 190, 255, .7), rgba(140, 190, 255, 0) 100%),
                radial-gradient(ellipse 30% 12% at 52% 80%, rgba(70, 120, 255, .65), rgba(70, 120, 255, 0) 100%),
                radial-gradient(circle at 78% 50%, rgba(255, 255, 255, .25), rgba(255, 255, 255, 0) 30%) !important;
            mix-blend-mode: screen;
            filter: blur(1px) !important;
            pointer-events: none;
        }
        @media (hover: hover) and (pointer: fine) {
            .home .orb {
                width: clamp(64px, 6vw, 96px);
                height: clamp(64px, 6vw, 96px);
            }
        }
    </style>

 <script>
        /* Home: orb follows the mouse anywhere on the page (desktop only) */
        (() => {
            const home = document.querySelector('.home');
            const video = document.querySelector('.home .video');
            const orb = document.querySelector('.home .orb');
            if (!home || !video || !orb) return;
            if (!matchMedia('(hover: hover) and (pointer: fine)').matches) return;

            const EASE = 0.12;
            let base = { x: 0, y: 0, r: 0 };
            const cur = { x: 0, y: 0 }, tgt = { x: 0, y: 0 };

            function measure() {
                orb.style.setProperty('--orb-x', '0px');
                orb.style.setProperty('--orb-y', '0px');
                const r = orb.getBoundingClientRect();
                base = { x: r.left + r.width / 2, y: r.top + r.height / 2, r: r.width / 2 };
            }

            addEventListener('mousemove', e => {
                tgt.x = e.clientX - base.x;
                tgt.y = e.clientY - base.y;
            });
            document.addEventListener('mouseleave', () => { tgt.x = 0; tgt.y = 0; }); // mouse left the window: back to start

            /* glass lens: a fixed layer that sits exactly on the orb */
            const lens = document.createElement('div');
            lens.className = 'orb-lens';
            lens.setAttribute('aria-hidden', 'true');
            document.body.appendChild(lens);
            document.documentElement.classList.add('has-lens');
            let lensSize = 0;

            function sizeLens(w) {
                lensSize = w;
                lens.style.width = lens.style.height = w + 'px';
                const map = document.getElementById('orbLensMap');
                if (!map) return;
                map.setAttribute('width', w);
                map.setAttribute('height', w);
                const disp = map.parentNode.querySelectorAll('feDisplacementMap');
                [0.5, 0.55, 0.6].forEach((k, i) => disp[i] && disp[i].setAttribute('scale', (w * k).toFixed(1)));
            }

            measure();
            addEventListener('resize', measure);
            (function tick() {
                cur.x += (tgt.x - cur.x) * EASE;
                cur.y += (tgt.y - cur.y) * EASE;
                orb.style.setProperty('--orb-x', cur.x.toFixed(2) + 'px');
                orb.style.setProperty('--orb-y', cur.y.toFixed(2) + 'px');
                const r = orb.getBoundingClientRect();
                if (Math.round(r.width) !== lensSize) sizeLens(Math.round(r.width));
                lens.style.left = r.left + 'px';
                lens.style.top = r.top + 'px';
                requestAnimationFrame(tick);
            })();
        })();

        document.querySelectorAll('.circle-hit').forEach(el => el.remove()); // older circle-only version
    </script>
