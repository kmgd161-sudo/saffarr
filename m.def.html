    <script>
		 $(document).ready(function () {
			$(document).on("click", ".js-popup", function (e) {
			 e.preventDefault();
	
			 const $this = $(this);
			 const href = $this.attr("href");
			 const ww = $(window).outerWidth();
	
			 function bindClose() {
				$(".b-popup__close")
				 .off("click")
				 .on("click", function () {
					$.magnificPopup.close();
				 });
			 }
	
			 function openPopup(targetHref) {
				$.magnificPopup.open({
				 items: {
					src: targetHref,
				 },
				 type: "inline",
				 fixedContentPos: true,
				 preloader: false,
				 mainClass: "custom-mfp",
				 showCloseBtn: false,
				 removalDelay: ww <= 780 ? 450 : 900,
				 callbacks: {
					open: function () {
					 const content = $.magnificPopup.instance.content[0];
					 setTimeout(() => {
						$(content).addClass("open");
	
						// مخصوص popup-geo
						if ($(content).attr("id") === "popup-geo") {
						 const geoListWrap = $(content).find(
							".b-geo-select__body"
						 );
						 const geoList = geoListWrap.find(
							".b-geo-select__list ul"
						 );
						 const arrow = $(content).find(".b-geo-select__arrow");
						 const geoListWrapHeight = geoListWrap.outerHeight();
						 const geoListHeight = geoList.height();
						 const mb = parseInt(geoListWrap.css("marginBottom")) || 0;
	
						 if (
							geoListHeight <=
							geoListWrapHeight - arrow.outerHeight() - mb
						 ) {
							arrow.hide();
						 }
						}
	
						bindClose(); // بعد از باز شدن، دکمه بسته شدن را فعال کن
					 }, 50);
					},
					beforeClose: function () {
					 const content = $.magnificPopup.instance.content[0];
					 $(content).removeClass("open");
					},
				 },
				});
			 }
	
			 if ($.magnificPopup.instance && $.magnificPopup.instance.isOpen) {
				$(document).one("mfpClose", function () {
				 setTimeout(() => {
					openPopup(href);
				 }, 100);
				});
				$.magnificPopup.close();
			 } else {
				openPopup(href);
			 }
			});
		 });
		</script>
