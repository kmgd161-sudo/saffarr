<body class="gallery-page about-page  cv-page light">
    <script>
        try {
            const savedTheme = localStorage.getItem('saffar-theme');
            if (savedTheme === 'light' || savedTheme === 'dark') document.body.classList.toggle('light', savedTheme === 'light');
        } catch (_) { }
    </script>

<basis core="call" file="header.inc" lid="2"></basis>


    <main class="about-main">

 <section class="about-hero" aria-label="Saffar Studio film">

        </section>
            </face>
        </basis>
       

        <article class="about-sheet">

                </div>
</face>
</basis>
                <section class="about-brands" aria-labelledby="brands-title">

   <h2 id="brands-title">@answer</h2>
                        </face>
                    </basis>
                 
                    <div class="about-brand-names">

                        </face>
                        </basis>
                    </div>
                    <div class="about-brand-marks">
                        <basis core="print" datamembername="db.img">
                            <face>
   <figure><img src="/@largeimg" alt="Eran platform">
                            <figcaption>@name<br>@description</figcaption>
                        </figure>
                            </face>
                        </basis>
                     
                       
                        
                    </div>
                </section>

                <section class="about-map" aria-label="International presence">

                        <span class="about-timeline-progress"></span>
                        <b class="about-stop" data-step="0" style="--x:4.94%;--step:0"><i>USA</i></b><b class="about-stop"
                            style="--x:10.93%;--step:1"><i>CAN</i></b><b class="about-stop"
                            style="--x:22.40%;--step:2"><i>BR</i></b><b class="about-stop"
                            style="--x:44.10%;--step:3"><i>ENG</i></b><b class="about-stop"
                            style="--x:49.30%;--step:4"><i>FRA</i></b><b class="about-stop"
                            style="--x:59.80%;--step:5"><i>IRQ</i></b><b class="about-stop"
                            style="--x:69.30%;--step:6"><i>IRI</i></b><b class="about-stop"
                            style="--x:78.10%;--step:7"><i>RUS</i></b><b class="about-stop"
                            style="--x:81.80%;--step:8"><i>CN</i></b>
                        <em>2024</em>

                            data-step="1" style="--x:15.882%;--y:24.872%;--step:1"></i><i class="about-map-node"
                            data-step="2" style="--x:31.629%;--y:62.564%;--step:2"></i><i class="about-map-node"
                            data-step="3" style="--x:45.357%;--y:20.256%;--step:3"></i><i class="about-map-node"
                            data-step="4" style="--x:47.645%;--y:26.410%;--step:4"></i><i class="about-map-node"
                            data-step="5" style="--x:58.681%;--y:33.333%;--step:5"></i><i class="about-map-node"
                            data-step="6" style="--x:65.276%;--y:33.333%;--step:6"></i><i class="about-map-node"
                            data-step="7" style="--x:76.447%;--y:15.641%;--step:7"></i><i class="about-map-node"

 <div><img src="/@largeimg" alt="@name"></div>

               .about-members .about-load-more{

     <basis core="call" file="footer.inc" lid="2"></basis>

   <basis core="call" file="menu.inc" lid="2"></basis>

    <script src="js/app.js"></script>
    <script>
        document.querySelectorAll('.about-load-more').forEach(function (button) {
            button.addEventListener('click', function () {
                var grid = button.previousElementSibling;
                grid.classList.toggle('is-expanded');
                button.firstChild.nodeValue = grid.classList.contains('is-expanded') ? 'Show Less ' : 'Load More ';
            });
        });

        (function () {
            var stops = Array.from(document.querySelectorAll('.about-stop'));
            var nodes = Array.from(document.querySelectorAll('.about-map-node'));
            var progress = document.querySelector('.about-timeline-progress');
            if (!progress || !stops.length || stops.length !== nodes.length) return;

            var lineStart = 4.94;
            var lineWidth = 76.86;
            var step = 0;

            /* every passed country (and the currently active one) stays lit —
               both here and on its matching map dot — until the sequence
               reaches the last stop, at which point it pauses, resets and
               starts filling again from the first country. */
            function showStep() {
                stops.forEach(function (stop, index) {
                    stop.classList.toggle('is-active', index <= step);
                });
                nodes.forEach(function (node, index) {
                    node.classList.toggle('is-active', index <= step);
                });
                var stopX = parseFloat(getComputedStyle(stops[step]).getPropertyValue('--x'));
                progress.style.setProperty('--progress', String((stopX - lineStart) / lineWidth));

                var atEnd = step >= stops.length - 1;
                step = atEnd ? 0 : step + 1;
                window.setTimeout(showStep, atEnd ? 2400 : 1400);
            }
            showStep();
        }());

        (function () {
            var sheet = document.querySelector('.about-sheet');
            var header = document.querySelector('header');
            var ticking = false;
            if (!sheet || !header) return;

            function syncHeader() {
                ticking = false;
                var sheetTop = sheet.getBoundingClientRect().top;
                document.body.classList.toggle('about-header-on-sheet', sheetTop <= header.offsetHeight);
            }
            syncHeader();
            window.addEventListener('resize', syncHeader);
            window.addEventListener('scroll', function () {
                if (ticking) return;
                ticking = true;
                requestAnimationFrame(syncHeader);
            }, {
                passive: true
            });
        }());
    </script>
</body>
